email.verification.subject: "{{.SystemName}} — Verify your email"
email.verification.body: |
  <p>Hello,</p><p>Use this code to verify your email address for {{.SystemName}}:</p>
  <p><strong>{{.Code}}</strong></p><p>This code expires in {{.Minutes}} minutes. If you did not request this, you can ignore this email.</p>
email.password_reset.subject: "{{.SystemName}} — Reset your password"
email.password_reset.body: |
  <p>Hello,</p><p>We received a request to reset your {{.SystemName}} password.</p>
  <p><a href="{{.Link}}">Reset your password</a></p><p>If the link does not work, copy and paste this URL into your browser:<br>{{.Link}}</p>
  <p>This link expires in {{.Minutes}} minutes. If you did not request this, you can ignore this email.</p>
email.wallet_low.subject: "{{.SystemName}} — Your balance is running low"
email.wallet_low.body: |
  <p>Your {{.SystemName}} wallet balance is running low.</p><p>Current balance: <strong>{{.Amount}}</strong>.</p>
  <p>Please top up to avoid interruptions to your service.</p><p><a href="{{.Link}}">Open your wallet</a></p>
email.subscription_low.subject: "{{.SystemName}} — Your subscription allowance is running low"
email.subscription_low.body: |
  <p>Your {{.SystemName}} subscription allowance is running low.</p><p>Remaining allowance: <strong>{{.Amount}}</strong>.</p>
  <p>Review your usage and available plans to avoid interruptions to your service.</p><p><a href="{{.Link}}">Manage your balance and plans</a></p>
email.channel_disabled.subject: "{{.SystemName}} — Channel {{.Name}} (#{{.ID}}) disabled"
email.channel_disabled.body: "<p>Channel <strong>{{.Name}}</strong> (#{{.ID}}) has been disabled.</p><p>Reason: {{.Reason}}</p>"
email.channel_enabled.subject: "{{.SystemName}} — Channel {{.Name}} (#{{.ID}}) enabled"
email.channel_enabled.body: "<p>Channel <strong>{{.Name}}</strong> (#{{.ID}}) has been enabled.</p>"
email.channel_test.subject: "{{.SystemName}} — Channel testing complete"
email.channel_test.body: "<p>All selected channel tests have completed.</p>"
email.upstream_update.subject: "{{.SystemName}} — Upstream model check report"
email.upstream_update.body: |
  <p>Upstream model check: {{.Checked}} channels checked; {{.Changed}} changed; {{.Added}} models added; {{.Removed}} removed; {{.AutoAdded}} automatically added; {{.Failed}} channels failed.</p>
  {{if .Channels}}<p>Changed channels ({{len .Channels}}/{{.ChannelCount}}):</p><ul>{{range .Channels}}<li>{{.ChannelName}} (+{{.AddCount}} / -{{.RemoveCount}})</li>{{end}}</ul>{{if .ChannelOmitted}}<p>Additional channels omitted: {{.ChannelOmitted}}.</p>{{end}}{{end}}
  {{if .AddedModels}}<p>Added model examples ({{len .AddedModels}}/{{.AddedCount}}):</p><ul>{{range .AddedModels}}<li>{{.}}</li>{{end}}</ul>{{if .AddedOmitted}}<p>Additional models omitted: {{.AddedOmitted}}.</p>{{end}}{{end}}
  {{if .RemovedModels}}<p>Removed model examples ({{len .RemovedModels}}/{{.RemovedCount}}):</p><ul>{{range .RemovedModels}}<li>{{.}}</li>{{end}}</ul>{{if .RemovedOmitted}}<p>Additional models omitted: {{.RemovedOmitted}}.</p>{{end}}{{end}}
  {{if .FailedIDs}}<p>Failed channel IDs ({{len .FailedIDs}}/{{.Failed}}): {{range .FailedIDs}}{{.}}; {{end}}</p>{{if .FailedOmitted}}<p>Additional failed channels omitted: {{.FailedOmitted}}.</p>{{end}}{{end}}
