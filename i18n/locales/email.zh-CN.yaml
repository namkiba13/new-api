email.verification.subject: "{{.SystemName}} — 验证邮箱地址"
email.verification.body: |
  <p>您好：</p><p>请使用以下验证码验证您在 {{.SystemName}} 的邮箱地址：</p>
  <p><strong>{{.Code}}</strong></p><p>验证码在 {{.Minutes}} 分钟内有效。如果不是您本人操作，请忽略此邮件。</p>
email.password_reset.subject: "{{.SystemName}} — 重置密码"
email.password_reset.body: |
  <p>您好：</p><p>我们收到了重置您的 {{.SystemName}} 账户密码的请求。</p>
  <p><a href="{{.Link}}">重置密码</a></p><p>如果链接无法打开，请复制以下地址并在浏览器中打开：<br>{{.Link}}</p>
  <p>链接在 {{.Minutes}} 分钟内有效。如果不是您本人操作，请忽略此邮件。</p>
email.wallet_low.subject: "{{.SystemName}} — 您的余额即将用尽"
email.wallet_low.body: |
  <p>您的 {{.SystemName}} 钱包余额即将用尽。</p><p>当前余额：<strong>{{.Amount}}</strong>。</p>
  <p>请及时充值，以免影响服务使用。</p><p><a href="{{.Link}}">打开钱包</a></p>
email.subscription_low.subject: "{{.SystemName}} — 您的订阅额度即将用尽"
email.subscription_low.body: |
  <p>您的 {{.SystemName}} 订阅额度即将用尽。</p><p>剩余额度：<strong>{{.Amount}}</strong>。</p>
  <p>请查看使用情况和可用套餐，以免影响服务使用。</p><p><a href="{{.Link}}">管理余额和订阅套餐</a></p>
email.channel_disabled.subject: "{{.SystemName}} — 通道 {{.Name}}（#{{.ID}}）已被禁用"
email.channel_disabled.body: "<p>通道 <strong>{{.Name}}</strong>（#{{.ID}}）已被禁用。</p><p>原因：{{.Reason}}</p>"
email.channel_enabled.subject: "{{.SystemName}} — 通道 {{.Name}}（#{{.ID}}）已被启用"
email.channel_enabled.body: "<p>通道 <strong>{{.Name}}</strong>（#{{.ID}}）已被启用。</p>"
email.channel_test.subject: "{{.SystemName}} — 通道测试完成"
email.channel_test.body: "<p>所有选定通道的测试均已完成。</p>"
email.upstream_update.subject: "{{.SystemName}} — 上游模型巡检报告"
email.upstream_update.body: |
  <p>上游模型巡检摘要：检测通道 {{.Checked}} 个，发现变更 {{.Changed}} 个，新增模型 {{.Added}} 个，删除 {{.Removed}} 个，自动新增 {{.AutoAdded}} 个，失败通道 {{.Failed}} 个。</p>
  {{if .Channels}}<p>变更通道明细（{{len .Channels}}/{{.ChannelCount}}）：</p><ul>{{range .Channels}}<li>{{.ChannelName}}（+{{.AddCount}} / -{{.RemoveCount}}）</li>{{end}}</ul>{{if .ChannelOmitted}}<p>省略的其他通道：{{.ChannelOmitted}} 个。</p>{{end}}{{end}}
  {{if .AddedModels}}<p>新增模型示例（{{len .AddedModels}}/{{.AddedCount}}）：</p><ul>{{range .AddedModels}}<li>{{.}}</li>{{end}}</ul>{{if .AddedOmitted}}<p>省略的其他模型：{{.AddedOmitted}} 个。</p>{{end}}{{end}}
  {{if .RemovedModels}}<p>删除模型示例（{{len .RemovedModels}}/{{.RemovedCount}}）：</p><ul>{{range .RemovedModels}}<li>{{.}}</li>{{end}}</ul>{{if .RemovedOmitted}}<p>省略的其他模型：{{.RemovedOmitted}} 个。</p>{{end}}{{end}}
  {{if .FailedIDs}}<p>失败通道 ID（{{len .FailedIDs}}/{{.Failed}}）：{{range .FailedIDs}}{{.}}; {{end}}</p>{{if .FailedOmitted}}<p>省略的其他失败通道：{{.FailedOmitted}} 个。</p>{{end}}{{end}}
